<div class="min-h-screen bg-gray-950 text-gray-100 flex flex-col">
  <!-- Header -->
  <header class="relative flex items-center justify-between px-6 py-4 bg-gray-900/80 backdrop-blur-sm border-b border-gray-800/50">
    <div class="flex items-center gap-3">
      <!-- COROS-style logo mark -->
      <div class="w-9 h-9 rounded-lg bg-coros/15 flex items-center justify-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="text-coros">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight uppercase">Coros<span class="text-coros">Music</span></h1>
      </div>
    </div>
    <div class="flex items-center gap-3">
      @if (watchConnected()) {
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-sync/10 border border-sync/20">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sync opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-sync"></span>
          </span>
          <span class="text-xs font-semibold text-sync uppercase tracking-wide">Watch Connected</span>
        </div>
        <button
          (click)="disconnectWatch()"
          class="px-3 py-1.5 text-xs font-medium rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-gray-200 transition-all border border-gray-700/50"
        >Disconnect</button>
      } @else {
        <button
          (click)="connectWatch()"
          class="group px-5 py-2.5 text-sm font-bold rounded-xl bg-coros hover:bg-coros-light text-white transition-all shadow-lg shadow-coros/20 hover:shadow-coros/30 uppercase tracking-wide"
        >
          <span class="flex items-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Connect Watch
          </span>
        </button>
      }
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    <!-- Left: Playlist picker -->
    <aside class="w-full lg:w-80 xl:w-96 bg-gray-900/40 border-r border-gray-800/50 overflow-y-auto">
      <app-playlist-picker />
    </aside>

    <!-- Right: Sync progress / tracks -->
    <section class="flex-1 overflow-y-auto">
      <app-sync-progress />
    </section>
  </main>

  <!-- Footer: Status bar -->
  <footer class="px-6 py-2.5 bg-gray-900/60 backdrop-blur-sm border-t border-gray-800/50 flex items-center gap-5 text-xs font-medium tracking-wide">
    <div class="flex items-center gap-1.5">
      @if (watchConnected()) {
        <span class="w-1.5 h-1.5 rounded-full bg-sync"></span>
        <span class="text-sync">/Music</span>
      } @else {
        <span class="w-1.5 h-1.5 rounded-full bg-gray-600"></span>
        <span class="text-gray-500">No watch</span>
      }
    </div>
    <span class="text-gray-500">{{ existingFiles().length }} files</span>
    <div class="flex items-center gap-1.5">
      @if (health.healthy()) {
        <span class="w-1.5 h-1.5 rounded-full bg-sync"></span>
        <span class="text-gray-400">API</span>
      } @else {
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
        <span class="text-amber-400">API</span>
      }
    </div>
  </footer>
</div>
